# agent-brain install and documentation site: static files only.
# Install as /etc/apache2/sites-available/wecansync-agentbrain.conf, then:
#   a2ensite wecansync-agentbrain && apache2ctl configtest && systemctl reload apache2
#   certbot --apache -d agentbrain.wecansync.com --redirect
# certbot adds the HTTPS copy of this host (wecansync-agentbrain-le-ssl.conf)
# and the HTTP-to-HTTPS redirect. Keep the "wecansync-" prefix: Apache serves
# requests that match no host with the first host in file-name order, so a name
# like "agentbrain.wecansync.com.conf" would become the server's default site.
#
# The site is published at agentbrain.sync.com.lb (synclb-agentbrain.conf on the
# server: this host with that ServerName, the same DocumentRoot, and a certificate
# from: certbot certonly --webroot -w /var/www/agentbrain.wecansync.com -d agentbrain.sync.com.lb).
# This former address keeps serving installers and releases directly and sends
# its pages to the new address with these lines in its port 80 and 443 hosts:
#     RewriteEngine on
#     RewriteCond %{REQUEST_URI} !^/(releases/|install\.sh$|install\.ps1$|\.well-known/)
#     RewriteRule ^ https://agentbrain.sync.com.lb%{REQUEST_URI} [R=301,L,NE]
<VirtualHost *:80>
    ServerName agentbrain.wecansync.com
    DocumentRoot /var/www/agentbrain.wecansync.com

    <Directory /var/www/agentbrain.wecansync.com>
        Options -Indexes -Includes -ExecCGI +SymLinksIfOwnerMatch
        AllowOverride None
        Require all granted
    </Directory>

    # Scripts are served as text so browsers show them and nothing executes them.
    AddType "text/plain; charset=utf-8" .sh .ps1
    AddType "application/json; charset=utf-8" .json
    AddType "image/svg+xml" .svg

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set X-Frame-Options "DENY"
    Header always set Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"

    # Installers, pages and the manifest change with every release: never serve them stale.
    <FilesMatch "^(index\.html|install\.sh|install\.ps1|latest\.json)$">
        Header set Cache-Control "no-cache"
    </FilesMatch>
    # A published version never changes.
    <LocationMatch "^/releases/[0-9]+\.[0-9]+\.[0-9]+/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>

    ErrorLog ${APACHE_LOG_DIR}/agentbrain.wecansync.com-error.log
    CustomLog ${APACHE_LOG_DIR}/agentbrain.wecansync.com-access.log combined
</VirtualHost>
